<!doctype html><meta charset="utf-8"><title>Karussell Cockpit</title>
<link rel="stylesheet" href="stil.css">
<link rel="stylesheet" href="fonts/google.css" id="googleCss">
<style>
:root{--ui:#22282b;--ui2:#2d3438;--rand:#3d464b;--fg:#e7ecee;--akz:#7fb3a3}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-rows:48px 1fr;
     background:var(--ui);color:var(--fg);font:14px/1.45 system-ui,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--ui2);
       border-bottom:1px solid var(--rand)}
header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.02em}
#projektwahl{display:flex;align-items:center;gap:6px;margin:0 auto 0 8px;min-width:0}
#projektwahl select{background:#1b2023;color:var(--fg);border:1px solid var(--rand);
  border-radius:6px;padding:6px 8px;font:13px system-ui;max-width:230px;min-width:90px;flex:0 1 auto}
#projektwahl button{padding:6px 11px;font-size:13px}
.dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:5000;background:#000a}
.dlg .karte{background:var(--ui2);border:1px solid var(--akz);border-radius:12px;
  padding:20px 22px;width:400px;max-width:calc(100vw - 32px);box-shadow:0 12px 40px #000c}
.dlg h2{font-size:15px;margin:0 0 4px}
.dlg .unter{font-size:12px;opacity:.65;margin:0 0 12px}
.dlg input[type=text]{font-size:15px;padding:9px}
.dlg .wahl{display:flex;gap:9px;align-items:flex-start;margin-top:8px;padding:9px 10px;
  border:1px solid var(--rand);border-radius:8px;cursor:pointer;opacity:1}
.dlg .wahl:has(input:checked){border-color:var(--akz);background:#1b2023}
.dlg .wahl input{margin-top:3px;accent-color:var(--akz)}
.dlg .wahl b{display:block;font-size:13px}
.dlg .wahl span{font-size:12px;opacity:.65}
.dlg .fehler{color:#e59a9a;font-size:12px;min-height:18px;margin-top:8px}
.dlg .knoepfe{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
button{background:var(--rand);color:var(--fg);border:0;border-radius:6px;padding:7px 14px;
       font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#4b565c}
button.haupt{background:var(--akz);color:#12201c}
button.haupt:hover{background:#96c6b7}
button:disabled{opacity:.45;cursor:default}
#status{font-size:12px;opacity:.75;min-width:0;flex:0 1 200px;text-align:right;line-height:1.3}
header h1,header button{white-space:nowrap}
main{display:grid;grid-template-columns:126px 1fr 336px;overflow:hidden}
#liste{overflow-y:auto;padding:10px;background:#1b2023;border-right:1px solid var(--rand)}
.mini{position:relative;width:104px;margin-bottom:9px;border:2px solid transparent;
      border-radius:4px;overflow:hidden;cursor:pointer;background:#000}
.mini.an{border-color:var(--akz)}
.mini .slide{transform-origin:top left}
.mini .nr{position:absolute;left:4px;bottom:2px;font:600 10px system-ui;color:#fff;
          text-shadow:0 1px 3px #000;z-index:2}
#mitte{display:grid;grid-template-rows:1fr 46px;overflow:hidden;min-width:0}
#buehne{display:flex;align-items:center;justify-content:center;overflow:auto;
        background:#4d5457;padding:18px}
#rahmen{box-shadow:0 8px 30px #0007;background:#fff;position:relative;
        margin:auto;flex:none}
#buehne.pan,#buehne.pan *{cursor:grab!important}
#buehne.schiebt,#buehne.schiebt *{cursor:grabbing!important}
.moveable-control-box{--moveable-color:#7fb3a3!important}
.moveable-control-box.gesperrt{--moveable-color:#9aa3a7!important}
.moveable-control-box.gesperrt .moveable-control{display:none!important}
.selecto-selection{border:1px solid #7fb3a3!important;background:rgba(127,179,163,.15)!important}
#zoomleiste{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--ui2);
  border-top:1px solid var(--rand)}
#zoomleiste input[type=range]{flex:1;accent-color:var(--akz);min-width:60px}
#zoomleiste button{padding:5px 10px;font-size:13px;line-height:1}
#zoomleiste input[type=number]{width:66px;background:#1b2023;color:var(--fg);
  border:1px solid var(--rand);border-radius:5px;padding:5px 6px;font:13px system-ui;
  text-align:right}
#zoomleiste .proz{font-size:12px;opacity:.7;margin-left:-4px}
#rahmen .slide{transform-origin:top left}
#rahmen .box{cursor:move;-webkit-user-select:none;user-select:none}
#rahmen .box.tippt{cursor:text;-webkit-user-select:text;user-select:text;outline:2px dashed #7fb3a3;outline-offset:6px}
#rahmen .box:hover{outline:1px dashed rgba(127,179,163,.5);outline-offset:4px}
#rahmen .box.gewaehlt:hover{outline:none}
#ausrichten{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
#ausrichten button,.knopfreihe button{padding:5px 0;font-size:12px}
.knopfreihe{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tasten{font-size:11px;opacity:.6;line-height:1.45;margin-top:6px;display:grid;
  grid-template-columns:auto 1fr;gap:5px 10px}
.tasten b{font-weight:600;white-space:nowrap}
details.abschnitt{border-top:1px solid var(--rand);margin-top:12px;padding-top:4px}
details.abschnitt summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;opacity:.75;padding:6px 0}
details.abschnitt[open] summary{opacity:1;color:var(--akz)}
.vorlagen{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.vorlagen button{padding:5px 0;font-size:11px}
#rahmen .box.zuschneiden{cursor:grab;outline:2px solid #7fb3a3;outline-offset:0}
#flaeche .geist{position:absolute;opacity:.35;pointer-events:none;overflow:visible!important}
#flaeche .geist .spiegel{position:absolute}
#buehne.ablegen{outline:3px dashed var(--akz);outline-offset:-8px}
.dlg .karte.breit{width:720px}
.reiter{display:flex;gap:6px;align-items:center}
.reiter button.an{background:var(--akz);color:#12201c}
.formraster{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.formwahl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:#1b2023}
.formwahl svg{width:80px;height:60px;overflow:visible}
.formwahl span{font-size:12px;opacity:.8}
.iconraster{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;
  max-height:52vh;overflow-y:auto;padding:2px}
.iconwahl{padding:8px;background:#1b2023;aspect-ratio:1}
.iconwahl:hover{background:#2f3a3e}
.iconbild{width:100%;height:100%;background:var(--fg);-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.blk .vorschau.form{display:flex;align-items:center;justify-content:center;padding:3px}
.galerie{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;max-height:46vh;overflow-y:auto}
.vorlagekarte{display:flex;flex-direction:column;gap:5px;padding:6px;background:#1b2023;border:2px solid transparent}
.vorlagekarte.an{border-color:var(--akz)}
.vorlagekarte img,.vorlagekarte .leerkarte{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;background:#e7ecee}
.vorlagekarte .leerkarte{display:flex;align-items:center;justify-content:center;color:#12201c;font-weight:300;font-size:44px}
.vorlagekarte span{font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schriftliste{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.schriftzeile{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 8px;background:#1b2023;border-radius:6px}
.schriftname{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.palette.klein{margin-top:5px}
.farbfeld{width:24px;height:24px;padding:0;border-radius:5px;border:1px solid #0006;position:relative}
.palette.klein .farbfeld{width:18px;height:18px}
.farbfeld span{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;
  text-shadow:0 0 3px #000;font-size:14px}
.palette:not(.klein) .farbfeld:hover span{display:flex}
.palette input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--rand);border-radius:5px;background:#1b2023}
#rahmen .griff{-webkit-user-select:none;user-select:none;position:absolute;background:#7fb3a3;
  border:1px solid #12201c;border-radius:2px}
#rahmen .griff.fassen{color:#12201c;display:flex;align-items:center;
  justify-content:center;font-weight:700;line-height:1}
#rahmen ::selection{background:#7fb3a3;color:#12201c}
#werkzeuge{position:fixed;display:none;align-items:center;gap:4px;z-index:99;
  background:#12181b;border:1px solid var(--akz);border-radius:8px;padding:5px 6px;
  box-shadow:0 6px 20px #0009}
#werkzeuge button{padding:5px 9px;font-size:13px;line-height:1;min-width:30px}
#werkzeuge input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--rand);
  border-radius:5px;background:#1b2023}
#werkzeuge select{background:#1b2023;color:var(--fg);border:1px solid var(--rand);
  border-radius:5px;padding:4px;font:12px system-ui;max-width:130px}
#werkzeuge .trenn{width:1px;height:20px;background:var(--rand);margin:0 2px}
#regler{overflow-y:auto;padding:14px;background:var(--ui2);border-left:1px solid var(--rand)}
fieldset{border:1px solid var(--rand);border-radius:8px;padding:10px 12px 14px;margin:0 0 14px;min-width:0}
fieldset.aktiv{border-color:var(--akz)}
legend{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
       opacity:.65;padding:0 5px}
fieldset.aktiv legend{opacity:1;color:var(--akz)}
label{display:block;font-size:11px;opacity:.75;margin:9px 0 3px}
textarea,input[type=text],input[type=number],select.schrift{width:100%;background:#1b2023;
  color:var(--fg);border:1px solid var(--rand);border-radius:5px;padding:7px;
  font:13px/1.45 system-ui;resize:vertical}
textarea{min-height:64px}
.reihe{display:flex;align-items:center;gap:8px}
.reihe input[type=range]{flex:1;accent-color:var(--akz);min-width:0}
.reihe output{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;opacity:.85}
.reihe input[type=color]{width:38px;height:26px;padding:0;border:1px solid var(--rand);
  border-radius:5px;background:#1b2023;flex:none}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.drei{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.hint{font-size:11px;opacity:.55;margin-top:10px;line-height:1.6}
.klein{padding:5px 9px;font-size:12px;font-weight:500}
.klein.an{background:var(--akz);color:#12201c}
.blk{display:flex;align-items:center;gap:6px;padding:4px;margin-bottom:4px;
  border:1px solid transparent;border-radius:6px;cursor:pointer}
.blk:hover{background:#1b2023}
.blk.an{border-color:var(--akz);background:#1b2023}
.blk .vorschau{width:34px;height:26px;flex:none;border-radius:4px;background:#1b2023;
  background-size:cover;background-position:center;border:1px solid var(--rand)}
.blk .vorschau.txt{display:flex;align-items:center;justify-content:center;
  font:700 12px system-ui;opacity:.55}
.blk .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:12px}
.blk button{padding:3px 6px;font-size:11px;line-height:1;flex:none}
.blk button.weg:hover{background:#9c4040}
#konflikt{position:fixed;left:50%;top:60px;transform:translateX(-50%);display:none;
  align-items:center;gap:10px;z-index:120;background:#12181b;color:var(--fg);
  border:1px solid var(--akz);border-radius:9px;padding:10px 14px;font-size:13px;
  box-shadow:0 8px 26px #000a}
#konflikt button{padding:6px 12px;font-size:12px}
#fertig{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:none;
  align-items:center;gap:10px;z-index:120;background:#12181b;color:var(--fg);
  border:1px solid var(--akz);border-radius:9px;padding:10px 14px;font-size:13px;
  box-shadow:0 8px 26px #000a}
#fertig button{padding:6px 12px;font-size:12px}
#fertig #fZu{padding:4px 9px;background:transparent;opacity:.6}
</style>
<script src="lib/moveable.min.js"></script>
<script src="lib/selecto.min.js"></script>
<script src="render.js"></script>
<body>
<header>
  <h1>Karussell Cockpit</h1>
  <div id="projektwahl">
    <select id="projekt" title="Welches Karussell"></select>
    <button id="pNeu" title="Neues Karussell, leer oder aus einer Vorlage">Neu</button>
    <button id="pDup" title="Gleicher Look und gleiche Texte unter neuem Namen">Duplizieren</button>
    <button id="pVorlage" title="Dieses Karussell als Vorlage fuer neue speichern">Als Vorlage</button>
    <button id="pClaude" title="Wunsch zu den markierten Elementen an Claude geben">An Claude</button>
  </div>
  <span id="status"></span>
  <button id="zurueck" title="Strg+Z">&#8630; Zurueck</button>
  <button id="vor" title="Strg+Y">&#8631; Vor</button>
  <button id="speichern">Gesichert</button>
  <button id="rBilder" class="haupt">Bilder fuer Instagram</button>
  <button id="rPptx">Datei fuer Canva</button>
  <button id="rPdf" title="Alle Folien als ein PDF, z. B. fuer LinkedIn oder zum Drucken">PDF</button>
</header>
<main>
  <div id="liste"></div>
  <div id="mitte">
    <div id="buehne"><div id="rahmen"><div id="flaeche"></div></div></div>
    <div id="zoomleiste">
      <button id="zMinus" title="rauszoomen">&minus;</button>
      <input type="range" id="zBalken" min="100" max="500" step="5" value="100">
      <button id="zPlus" title="reinzoomen">+</button>
      <input type="number" id="zZahl" min="25" max="800" step="5" value="100">
      <span class="proz">%</span>
      <button id="zFit">Einpassen</button>
    </div>
  </div>
  <div id="regler"></div>
</main>
<div id="konflikt">
  <span>Jemand anderes hat gleichzeitig etwas geaendert. Was soll gelten?</span>
  <button id="kUeber" class="haupt">Die neue Aenderung</button>
  <button id="kMeins">Meine Fassung</button>
</div>
<div id="fertig">
  <span id="fText"></span>
  <button id="fOrdner" class="haupt">Anzeigen</button>
  <button id="fZip">Als ZIP laden</button>
  <button id="fPdf">PDF herunterladen</button>
  <button id="fZu" title="schliessen">&times;</button>
</div>
<div id="elemente" class="dlg">
  <div class="karte breit">
    <div class="reiter">
      <button data-tab="formen">Formen</button>
      <button data-tab="icons">Icons</button>
      <span class="unter" style="margin:0 0 0 auto">Lucide und Tabler, frei nutzbar</span>
    </div>
    <div id="eFormen" class="formraster"></div>
    <div id="eIcons" style="display:none">
      <div class="reihe" style="margin:10px 0 8px">
        <input type="text" id="eSuche" placeholder="Suchen, z. B. Herz, Geld, Pfeil, Instagram" autocomplete="off">
        <select id="eSatz" class="schrift" style="width:auto">
          <option value="">alle</option><option value="lucide">Lucide</option>
          <option value="tabler">Tabler</option><option value="tabler-voll">gefuellt</option>
        </select>
      </div>
      <div id="eAnzahl" class="unter"></div>
      <div id="eRaster" class="iconraster"></div>
    </div>
    <div class="knoepfe"><button id="eZu">Schliessen</button></div>
  </div>
</div>
<div id="auftrag" class="dlg">
  <div class="karte">
    <h2>An Claude</h2>
    <p class="unter" id="aUnter"></p>
    <textarea id="aText" style="min-height:110px" placeholder="Was soll Claude machen? Zum Beispiel: Mach den Titel kuerzer und knalliger."></textarea>
    <div class="fehler" id="aFehler"></div>
    <div class="knoepfe">
      <button id="aAb">Abbrechen</button>
      <button id="aOk" class="haupt">An Claude geben</button>
    </div>
  </div>
</div>
<div id="dialog" class="dlg">
  <div class="karte">
    <h2 id="dTitel"></h2>
    <p class="unter" id="dUnter"></p>
    <input type="text" id="dName" placeholder="Name, z. B. Kompass" autocomplete="off">
    <div id="dGalerie" class="galerie"></div>
    <div id="dFormat">
      <label class="wahl"><input type="radio" name="fmt" value="45" checked>
        <div><b>4:5, fuer automatisches Posten</b><span>Standard. Geht so um 8 Uhr live, wie du es hier siehst.</span></div></label>
      <label class="wahl"><input type="radio" name="fmt" value="34">
        <div><b>3:4, nur fuer Posten von Hand in der App</b><span>Etwas hoeher. Die Automatik muss es verkleinern.</span></div></label>
    </div>
    <div class="fehler" id="dFehler"></div>
    <div class="knoepfe">
      <button id="dAb">Abbrechen</button>
      <button id="dOk" class="haupt">Anlegen</button>
    </div>
  </div>
</div>
<div id="schriften" class="dlg">
  <div class="karte breit">
    <h2>Schriften</h2>
    <p class="unter">Google Fonts, frei nutzbar und auch in Canva vorhanden. Einmal laden, danach offline.</p>
    <div class="reihe" style="margin-bottom:10px">
      <input type="text" id="sSuche" placeholder="Suchen, z. B. Bebas, Playfair, Caveat" autocomplete="off">
      <select id="sArt" class="schrift" style="width:auto">
        <option value="">alle Arten</option><option value="Sans Serif">ohne Serifen</option>
        <option value="Serif">mit Serifen</option><option value="Display">Display</option>
        <option value="Handwriting">Handschrift</option><option value="Monospace">Monospace</option>
      </select>
    </div>
    <div id="sListe" class="schriftliste"></div>
    <div class="knoepfe"><button id="sZu">Schliessen</button></div>
  </div>
</div>
<div id="werkzeuge">
  <button data-f="b" title="fett"><b>F</b></button>
  <button data-f="i" title="kursiv"><i>K</i></button>
  <button data-f="u" title="unterstrichen"><u>U</u></button>
  <span class="trenn"></span>
  <button data-f="akzent" title="Akzentfarbe">Akzent</button>
  <button data-f="m" title="gruen hinterlegt">Marker</button>
  <input type="color" id="wFarbe" title="eigene Farbe">
  <span class="trenn"></span>
  <select id="wSchrift" title="Schrift der Markierung"></select>
  <span class="trenn"></span>
  <button data-f="weg" title="Auszeichnungen entfernen">&#8630;</button>
</div>
<script>
let D = null, akt = 0, sel = null, letzteLayout = {}, k = 1, timer = null;
let posFelder = {}, gemerkteMk = null, historie = [], zukunft = [];
let meinStand = null, gesicherterStand = '', speichertGerade = false, sicherTimer = null;
let zoom = 100, kFit = 1;
let PROJEKT = '', wechseltGerade = false;

// Jede Anfrage nennt ihr Projekt. So landet nichts im falschen Karussell,
// auch wenn von aussen gerade ein anderes geoeffnet wird.
function mitProjekt(url){
  return url + (url.indexOf('?') < 0 ? '?' : '&') + 'projekt=' + encodeURIComponent(PROJEKT);
}

function q(tag, attr, kinder){
  const e = document.createElement(tag);
  for (const n in (attr || {})) { if (n === 'html') e.innerHTML = attr[n]; else e.setAttribute(n, attr[n]); }
  (kinder || []).forEach(x => e.appendChild(x));
  return e;
}
// Mac: Tasten so nennen, wie sie auf der Tastatur stehen
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
function tt(s){
  if (!MAC) return s;
  return String(s).replace(/Strg\+Umschalt\+/g, '\u2318\u21e7').replace(/Strg\+Y/g, '\u2318\u21e7Z')
    .replace(/Strg\+/g, '\u2318').replace(/\bStrg\b/g, '\u2318').replace(/\bEntf\b/g, '\u232b')
    .replace(/Explorer/g, 'Finder').replace(/Mausrad/g, 'Mausrad oder Trackpad');
}
document.addEventListener('DOMContentLoaded', () => {
  if (MAC) document.querySelectorAll('[title]').forEach(el => { el.title = tt(el.title); });
});
function melde(t, dauer){
  const s = document.getElementById('status');
  t = tt(t);
  s.textContent = t;
  if (dauer !== 0) setTimeout(() => { if (s.textContent === t) s.textContent = ''; }, dauer || 2600);
}
function slide(){ return D.slides[akt]; }
function bloecke(){ const s = slide(); if (!s.bloecke) s.bloecke = []; return s.bloecke; }
function blockVon(id){ return bloecke().filter(b => b.id === id)[0] || null; }
function istBild(id){ const b = blockVon(id); return !!(b && b.typ === 'bild'); }
function neueId(){
  let max = 0;
  D.slides.forEach(s => (s.bloecke || []).forEach(b => {
    const n = +String(b.id || '').slice(1); if (n > max) max = n;
  }));
  return 'b' + (max + 1);
}
// Lesen friert nichts ein. Erst eine Positionsaenderung nimmt die Slide aus dem Raster.
function posVon(id){
  const b = blockVon(id);
  if (!b) return null;
  return frei(b) ? b : (letzteLayout[id] || null);
}
function posSchreiben(id){
  const s = slide();
  (s.bloecke || []).forEach(b => {
    if (!frei(b) && letzteLayout[b.id]){
      const L = letzteLayout[b.id];
      b.x = L.x; b.y = L.y; b.w = L.w;
      if (b.typ === 'bild' && L.h !== undefined) b.h = L.h;
    }
  });
  return blockVon(id);
}
function imRaster(){ return (slide().bloecke || []).every(b => b.typ === 'form' || !frei(b)); }
function insRaster(){
  (slide().bloecke || []).forEach(b => { if (b.typ !== 'form'){ delete b.x; delete b.y; delete b.w; delete b.h; } });
}

// --------------------------------------------- Datei live nachziehen

function schmutzig(){ return JSON.stringify(D) !== gesicherterStand; }

async function datenHolen(){
  const d = await (await fetch(BASIS + 'inhalt.json?' + Date.now())).json();
  d.stil = Object.assign({}, STIL_STD, d.stil || {});
  return d;
}
function konflikt(an){ document.getElementById('konflikt').style.display = an ? 'flex' : 'none'; }

async function vonDatei(){
  const vorher = JSON.stringify(D);
  const merkSel = sel;
  D = await datenHolen();
  if (akt >= D.slides.length) akt = D.slides.length - 1;
  sel = blockVon(merkSel) ? merkSel : null;
  gemerkteMk = null;
  historie.push(vorher);                 // Zurueck macht die fremde Aenderung rueckgaengig
  if (historie.length > 50) historie.shift();
  zukunft.length = 0;
  alles();
  gesicherterStand = JSON.stringify(D);
  knoepfe(); konflikt(false);
}

async function speichern(){
  speichertGerade = true;
  try {
    const r = await fetch(mitProjekt('speichern'), {method: 'POST', body: JSON.stringify(D, null, 2)});
    if (r.ok){
      meinStand = (await r.text()).trim();
      gesicherterStand = JSON.stringify(D);
      konflikt(false);
    }
    return r.ok;
  } finally { speichertGerade = false; }
}

// Stand = "<aktuelles Projekt>|<Zeitstempel>". Wurde von aussen ein anderes
// Projekt geoeffnet, wechselt das Cockpit mit, statt einen Konflikt zu melden.
async function pruefeDatei(){
  if (speichertGerade || wechseltGerade) return;
  let s;
  try { s = (await (await fetch('stand', {cache: 'no-store'})).text()).trim(); }
  catch (e) { return; }
  if (!s || s === meinStand) return;
  const name = s.split('|')[0];
  if (name && name !== PROJEKT){
    await projektLaden(name);
    melde('Von aussen geoeffnet: ' + name, 9000);
    return;
  }
  if (!D) return;
  meinStand = s;
  if (schmutzig()){ konflikt(true); return; }
  await vonDatei();
  melde('Von aussen geaendert. Gefaellt es nicht? Oben auf Zurueck.', 9000);
}

// Alles wird von selbst gesichert, niemand muss ans Speichern denken.
function knopfStand(){
  const b = document.getElementById('speichern');
  const s = schmutzig();
  b.textContent = s ? 'sichert ...' : 'Gesichert';
  b.disabled = !s;
}
function autoSichern(){
  knopfStand();
  clearTimeout(sicherTimer);
  sicherTimer = setTimeout(async () => {
    if (!schmutzig()) return;
    if (document.getElementById('konflikt').style.display === 'flex') return;
    await speichern();
    knopfStand();
  }, 900);
}

// ------------------------------------------------------------ Zurueck / Vor

function merke(){
  const s = JSON.stringify(D);
  if (historie.length && historie[historie.length - 1] === s) return;
  historie.push(s);
  if (historie.length > 50) historie.shift();
  zukunft.length = 0;
  knoepfe();
}
function knoepfe(){
  document.getElementById('zurueck').disabled = !historie.length;
  document.getElementById('vor').disabled = !zukunft.length;
}
function springe(von, nach){
  if (!von.length) return;
  nach.push(JSON.stringify(D));
  D = JSON.parse(von.pop());
  sel = null; gemerkteMk = null;
  if (akt >= D.slides.length) akt = D.slides.length - 1;
  alles(); knoepfe();
}
function schiebeEbene(id, richtung){
  const s = slide();
  const f = ebenen(s);
  const i = f.indexOf(id), j = i + richtung;
  if (i < 0 || j < 0 || j >= f.length) return;
  const t = f[i]; f[i] = f[j]; f[j] = t;
  s.ebenen = f;
  baueRegler(); zeichneBuehne(); zeichneMinis();
}

// ------------------------------------------------- Markieren und Formatieren

function spanFuer(node){
  let n = (node && node.nodeType === 3) ? node.parentElement : node;
  while (n && !(n.dataset && n.dataset.von !== undefined)) n = n.parentElement;
  return n;
}
function markierung(){
  const s = window.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return null;
  const r = s.getRangeAt(0);
  if (!document.getElementById('rahmen').contains(r.commonAncestorContainer)) return null;
  const a = spanFuer(r.startContainer), b = spanFuer(r.endContainer);
  if (!a || !b) return null;
  const box = a.closest('.box');
  if (!box || box !== b.closest('.box')) return null;
  const v = +a.dataset.von + r.startOffset, w = +b.dataset.von + r.endOffset;
  if (v === w) return null;
  return {art: box.dataset.art, von: Math.min(v, w), bis: Math.max(v, w),
          rechteck: r.getBoundingClientRect()};
}
function feldFuer(id){
  const b = blockVon(id);
  return (b && b.typ !== 'bild') ? {lies: () => b.text || '', schreib: v => b.text = v} : null;
}
function aktuelleMk(){ return markierung() || gemerkteMk; }

function formatiere(aend){
  const mk = aktuelleMk();
  if (!mk) return;
  const feld = feldFuer(mk.art);
  if (!feld) return;
  merke();
  const z = zerlege(feld.lies());
  const teil = z.slice(mk.von, mk.bis);
  if (!teil.length) return;
  Object.keys(aend).forEach(t => {
    let w = aend[t];
    if (w === 'um') w = teil.every(x => x.f[t]) ? undefined : true;
    teil.forEach(x => { if (w === undefined) delete x.f[t]; else x.f[t] = w; });
  });
  feld.schreib(serialisiere(z));
  baueRegler(); zeichneBuehne(); zeichneMinis();
  markiereWieder(mk.art, mk.von, mk.bis);
}
function markiereWieder(id, von, bis){
  const box = [].slice.call(document.querySelectorAll('#rahmen .box'))
                .filter(b => b.dataset.art === id)[0];
  if (!box) return;
  const sp = [].slice.call(box.querySelectorAll('[data-von]'));
  const a = sp.filter(s => +s.dataset.von <= von && von < +s.dataset.bis)[0];
  const b = sp.filter(s => +s.dataset.von < bis && bis <= +s.dataset.bis)[0];
  if (!a || !b || !a.firstChild || !b.firstChild) return;
  try {
    const r = document.createRange();
    r.setStart(a.firstChild, von - +a.dataset.von);
    r.setEnd(b.firstChild, bis - +b.dataset.von);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch (e) { return; }
  werkzeugeZeigen();
}
function werkzeugeZeigen(){
  const t = document.getElementById('werkzeuge');
  const mk = markierung();
  if (!mk){ if (!gemerkteMk) t.style.display = 'none'; return; }
  gemerkteMk = mk;
  t.style.display = 'flex';
  const r = mk.rechteck, bw = t.offsetWidth, bh = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width / 2 - bw / 2)) + 'px';
  t.style.top  = Math.max(8, r.top - bh - 10) + 'px';
  const feld = feldFuer(mk.art);
  if (!feld) return;
  const teil = zerlege(feld.lies()).slice(mk.von, mk.bis);
  t.querySelectorAll('button[data-f]').forEach(b => {
    const kk = b.dataset.f;
    const an = kk === 'weg' ? false
             : kk === 'akzent' ? teil.every(x => x.f.c === 'akzent')
             : teil.length && teil.every(x => x.f[kk]);
    b.classList.toggle('an', !!an);
  });
  document.getElementById('wSchrift').value = (teil[0] && teil[0].f.f) || '';
}
function abwaehlen(){
  gemerkteMk = null;
  document.getElementById('werkzeuge').style.display = 'none';
  const s = window.getSelection(); if (s) s.removeAllRanges();
  if (sel || auswahl.length || textModus){ sel = null; auswahl = []; textModus = null; baueRegler(); zielSetzen(); }
}

function schieber(bez, wert, min, max, schritt, cb, resetbar){
  const box = q('div', {}, [q('label', {html: bez})]);
  const r = q('div', {class: 'reihe'});
  const i = document.createElement('input');
  i.type = 'range'; i.min = min; i.max = max; i.step = schritt;
  i.value = (wert === null || wert === undefined) ? min : wert;
  const o = document.createElement('output');
  o.textContent = (wert === null || wert === undefined) ? 'auto' : (+i.value).toFixed(schritt < 1 ? 2 : 0);
  i.onpointerdown = merke;
  i.oninput = () => { o.textContent = (+i.value).toFixed(schritt < 1 ? 2 : 0); cb(+i.value); zeichne(); };
  r.appendChild(i); r.appendChild(o);
  if (resetbar){
    const b = q('button', {class: 'klein', html: 'auto'});
    b.onclick = () => { merke(); cb(null); baueRegler(); zeichne(); };
    r.appendChild(b);
  }
  box.appendChild(r); return box;
}
function farbe(bez, wert, cb){
  const box = q('div', {}, [q('label', {html: bez})]);
  const r = q('div', {class: 'reihe'});

  const t = document.createElement('input'); t.type = 'text';  t.value = wert;
  i.onpointerdown = merke; t.onfocus = merke;
  i.oninput  = () => { t.value = i.value; cb(i.value); zeichne(); };
  t.onchange = () => { i.value = t.value; cb(t.value); zeichne(); };
  r.appendChild(i); r.appendChild(t); box.appendChild(r);
  if (D && D.stil){
    const p = q('div', {class: 'palette klein'});

// ------------------------------------------------------------ Bilder bearbeiten
// Ausschnitt (Doppelklick aufs Bild), Spiegeln, Filter, Deckkraft, Ecken,
// Rahmen, Schatten. Gezeichnet wird in render.js (bildWirkung), hier nur Bedienung.

let zuschnitt = null;                   // id des Bildes im Ausschnitt-Modus
const bildMasse = {};                   // url -> {w, h} der Originaldatei
const offeneAbschnitte = {};            // welche Panel-Abschnitte offen sind

function bildMasseLaden(url){
  if (bildMasse[url]) return Promise.resolve(bildMasse[url]);
  return new Promise(fertig => {
    const i = new Image();
    i.onload = () => { bildMasse[url] = {w: i.naturalWidth, h: i.naturalHeight}; fertig(bildMasse[url]); };
    i.onerror = () => fertig({w: 0, h: 0});
    i.src = url;
  });
}

// Wo liegt das ganze Bild relativ zur Box? (gleiche Rechnung wie object-fit
// cover + background-position + Zoom um den gewaehlten Punkt)
function ausschnittGeometrie(b, w, h, iw, ih){
  const a = ausschnittVon(b), s0 = Math.max(w / iw, h / ih);
  const W = iw * s0 * a.z, H = ih * s0 * a.z;
  const cx = w - W, cy = h - H;          // immer <= 0: so weit laesst sich schieben
  return {L: a.x / 100 * cx, T: a.y / 100 * cy, W: W, H: H, cx: cx, cy: cy};
}

// Unterobjekt-Feld setzen; Standardwert oder null entfernt es wieder
function setzeTief(b, gruppe, feld, wert, standard){
  const o = Object.assign({}, b[gruppe] || {});
  if (wert === null || wert === undefined || wert === standard) delete o[feld]; else o[feld] = wert;
  if (Object.keys(o).length) b[gruppe] = o; else delete b[gruppe];
}

// ----- Ausschnitt-Modus
function zuschnittStart(id){
  const b = blockVon(id);
  if (!b || b.typ !== 'bild' || b.gesperrt) return;
  zuschnitt = id; textModus = null;
  sel = id; auswahl = [id];
  baueRegler(); zielSetzen(); geistZeigen();
  melde('Ausschnitt: Bild ziehen verschiebt, Mausrad zoomt. Esc oder Klick daneben beendet.', 8000);
}
function zuschnittEnde(){
  if (!zuschnitt) return;
  zuschnitt = null;
  const g = document.querySelector('#flaeche .geist'); if (g) g.remove();
  baueRegler(); zielSetzen(); zeichneMinis();
}
// Das ganze Bild blass hinter der Box zeigen, wie Canva beim Zuschneiden
async function geistZeigen(){
  const alt = document.querySelector('#flaeche .geist'); if (alt) alt.remove();
  if (!zuschnitt) return;
  const b = blockVon(zuschnitt), el = boxVon(zuschnitt);
  if (!b || !el || !DATEI_OK.test(b.datei || '')) return;
  const m = await bildMasseLaden(BASIS + b.datei);
  if (!m.w || zuschnitt !== b.id || !el.isConnected) return;
  const rand = el.clientLeft, w = el.clientWidth, h = el.clientHeight;
  const g = ausschnittGeometrie(b, w, h, m.w, m.h);
  const geist = document.createElement('div');
  geist.className = 'geist';
  geist.style.cssText = el.style.cssText;
  geist.style.filter = ''; geist.style.opacity = ''; geist.style.border = '';
  const sp = el.querySelector('.spiegel').cloneNode(false);
  sp.style.inset = rand + 'px';
  const bildEl = document.createElement('img');
  bildEl.src = BASIS + b.datei;
  bildEl.style.cssText = 'position:absolute;left:' + g.L + 'px;top:' + g.T + 'px;width:' + g.W +
                         'px;height:' + g.H + 'px;filter:' + (el.querySelector('.bildflaeche').style.filter || 'none');
  sp.appendChild(bildEl); geist.appendChild(sp);
  el.parentNode.insertBefore(geist, el);
}
function zuschnittAendern(neu){
  const b = blockVon(zuschnitt), el = boxVon(zuschnitt);
  if (!b || !el) return;
  b.ausschnitt = neu;
  if (neu.z === 1 && neu.x === 50 && neu.y === 50) delete b.ausschnitt;
  bildWirkung(el, b); geistZeigen(); autoSichern();
}
// Ziehen verschiebt das Bild in seiner Box (Drehung und Spiegeln eingerechnet)
async function zuschnittZiehen(e){
  const b = blockVon(zuschnitt), el = boxVon(zuschnitt);
  const m = await bildMasseLaden(BASIS + b.datei);
  if (!m.w) return;
  merke();
  const w = el.clientWidth, h = el.clientHeight;
  const start = ausschnittGeometrie(b, w, h, m.w, m.h), a0 = ausschnittVon(b);
  const mx = e.clientX, my = e.clientY, r = (b.dreh || 0) * Math.PI / 180;
  const s = String(b.spiegeln || ''), fx = s.indexOf('h') >= 0 ? -1 : 1, fy = s.indexOf('v') >= 0 ? -1 : 1;
  const move = ev => {
    const dx = (ev.clientX - mx) / k, dy = (ev.clientY - my) / k;
    const lx = (dx * Math.cos(r) + dy * Math.sin(r)) * fx, ly = (-dx * Math.sin(r) + dy * Math.cos(r)) * fy;
    const nx = start.cx < -0.5 ? Math.max(0, Math.min(100, 100 * (start.L + lx) / start.cx)) : a0.x;
    const ny = start.cy < -0.5 ? Math.max(0, Math.min(100, 100 * (start.T + ly) / start.cy)) : a0.y;
    zuschnittAendern({z: a0.z, x: Math.round(nx * 10) / 10, y: Math.round(ny * 10) / 10});
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    baueRegler(); zeichneMinis();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function zuschnittZoom(faktor){
  const b = blockVon(zuschnitt); if (!b) return;
  const a = ausschnittVon(b);

let iconIndex = null, deWoerter = {}, elementeErsetzen = null;

async function iconIndexLaden(){
  if (iconIndex) return iconIndex;
  const [i, d] = await Promise.all([fetch('bib/index.json').then(r => r.json()),
                                    fetch('bib/de.json').then(r => r.json()).catch(() => ({}))]);
  iconIndex = i; deWoerter = d;
  return iconIndex;
}
// Gleiche Wertung wie icons_suchen() in k.py
function iconsSuchen(frage, satzFilter, n){
  const woerter = (frage.toLowerCase().match(/[a-z0-9äöüß]+/g) || []).map(w => {
    w = w.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
    return [w].concat((Object.prototype.hasOwnProperty.call(deWoerter, w) ? String(deWoerter[w]) : '').split(' ').filter(Boolean));
  });
  const treffer = [];
  for (const satz in iconIndex){
    if (satzFilter && satz !== satzFilter) continue;
    const e = iconIndex[satz];
    for (const nm in e){
      if (!woerter.length){ treffer.push([0, satz !== 'lucide', nm.length, satz + '/' + nm]); continue; }
      let punkte = 0, ok = true;
      const teile = nm.split('-'), tags = ' ' + e[nm] + ' ';
      for (const varianten of woerter){
        let best = 0;
        for (const w of varianten){
          if (nm === w) best = Math.max(best, 10);
          else if (teile.indexOf(w) >= 0) best = Math.max(best, 6);
          else if (tags.indexOf(' ' + w + ' ') >= 0) best = Math.max(best, 3);
          else if (nm.indexOf(w) >= 0) best = Math.max(best, 2);
        }
        if (!best){ ok = false; break; }
        punkte += best;
      }
      if (ok && punkte) treffer.push([-punkte, satz !== 'lucide', nm.length, satz + '/' + nm]);
    }
  }
  treffer.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2] || (a[3] < b[3] ? -1 : 1));
  return treffer.slice(0, n || 120).map(t => t[3]);
}

function schriftenZu(){ document.getElementById('schriften').style.display = 'none'; }
function schriftenZeigen(){
  const frage = document.getElementById('sSuche').value.trim().toLowerCase();
  const art = document.getElementById('sArt').value;
  const geladen = new Set(SCHRIFTEN_EXTRA), eingebaut = new Set(SCHRIFTEN);

    .sort((a, b) => (a.f.toLowerCase().indexOf(frage) === 0 ? 0 : 1) - (b.f.toLowerCase().indexOf(frage) === 0 ? 0 : 1) || a.p - b.p)
    .slice(0, 60);

async function schriftHolen(family, knopfEl){
  knopfEl.disabled = true; knopfEl.textContent = 'laedt ...';
  let j;
  try { j = await (await fetch('schrift', {method: 'POST', body: JSON.stringify({family: family})})).json(); }
  catch (e) { j = {ok: false, fehler: 'Das Cockpit antwortet nicht.'}; }
  if (!j.ok){ knopfEl.disabled = false; knopfEl.textContent = 'Laden'; melde('Schrift ging nicht: ' + j.fehler, 8000); return; }
  // neue @font-face-Regeln einlesen, ohne die Seite neu zu laden
  const css = document.getElementById('googleCss');
  css.href = 'fonts/google.css?' + Date.now();
  await new Promise(r => { css.onload = r; setTimeout(r, 1500); });
  await schriftenLaden();
  try { await document.fonts.load("400 40px '" + family + "'"); await document.fonts.load("700 40px '" + family + "'"); } catch (e) {}
  werkzeugSchriftenFuellen();
  schriftenZeigen(); baueRegler();
  melde('Schrift ' + family + ' geladen. Sie steht jetzt in jeder Schriftauswahl.', 6000);
}

// ------------------------------------------------------------ Freistellen
// Laeuft auf dem eigenen Rechner. Das Ergebnis ersetzt die Bilddatei, das
// Original bleibt im Feld `original` und kommt mit einem Klick zurueck.
const laeuftFrei = {};
// Freisteller einmalig laden (GitHub, mit Pruefsumme), Fortschritt aus GET /modelle
async function modellLaden(modell){
  let j;
  try { j = await (await fetch('modell', {method: 'POST', body: JSON.stringify({modell: modell})})).json(); }
  catch (e) { j = {ok: false, fehler: 'Das Cockpit antwortet nicht.'}; }
  if (!j.ok){ melde('Laden ging nicht: ' + j.fehler, 9000); return false; }
  for (;;){
    await new Promise(r => setTimeout(r, 1000));
    let st;
    try { st = await (await fetch('modelle', {cache: 'no-store'})).json(); } catch (e) { continue; }
    const l = st.laden || {};
    if (l.fehler){ melde('Laden ging nicht: ' + l.fehler, 9000); return false; }
    if ((st.da || []).indexOf(modell) >= 0){ melde('Freisteller ist eingerichtet.', 3000); return true; }
    if (!l.modell){ melde('Laden wurde abgebrochen. Bitte noch einmal versuchen.', 9000); return false; }
    const pz = l.gesamt ? Math.min(99, Math.floor(100 * l.gelesen / l.gesamt)) : 0;
    melde('Lade den Freisteller ... ' + pz + ' %', 0);
  }
}

async function freistellen(id, modell){
  const b0 = blockVon(id);
  if (!b0) return;
  const quelle = b0.original || b0.datei, projekt = PROJEKT, schluessel = id + modell;
  if (laeuftFrei[schluessel]) return;
  laeuftFrei[schluessel] = true;
  melde(modell === 'genau' ? 'Stelle gruendlich frei, etwa 2 Minuten. Du kannst weiterarbeiten.'
                           : 'Entferne den Hintergrund ...', 0);
  let j;
  try {
    j = await (await fetch(mitProjekt('freistellen'), {method: 'POST',
      body: JSON.stringify({datei: quelle, modell: modell})})).json();
  } catch (e) { j = {ok: false, fehler: 'Das Cockpit antwortet nicht.'}; }
  delete laeuftFrei[schluessel];
  if (!j.ok && j.fehlt){
    const mb = Math.round(+j.mb || 0);
    if (!confirm('Der Freisteller ist noch nicht eingerichtet. Jetzt einmalig laden (' + mb +
                 ' MB)? Danach geht es ohne Internet.')) { melde('', 0); return; }
    if (await modellLaden(j.fehlt)) return freistellen(id, modell);
    return;
  }
  if (!j.ok){ melde('Freistellen ging nicht: ' + j.fehler, 9000); return; }
  if (PROJEKT !== projekt){ melde('Freigestellt, liegt im Projekt ' + projekt + '.', 6000); return; }
  let ziel = null;
  D.slides.forEach(s => (s.bloecke || []).forEach(x => { if (x.id === id) ziel = x; }));
  if (!ziel){ melde('Freigestellt, aber das Bild ist nicht mehr da.', 6000); return; }
  merke();
  if (!ziel.original) ziel.original = ziel.datei;
  ziel.datei = j.datei;
  alles();
  melde('Hintergrund entfernt. Gefaellt es nicht? Original zurueck oder Strg+Z.', 8000);
}

// Auswahl: auswahl = alle markierten ids, sel = die zuletzt angeklickte (fuer das Panel).
// Ziehen, Skalieren, Drehen und Einrasten macht Moveable, die Rahmenauswahl Selecto.
let mv = null, sx = null, auswahl = [], textModus = null, leertaste = false;
let ablage = null;

function boxVon(id){
  return [].slice.call(document.querySelectorAll('#flaeche .box')).filter(el => el.dataset.art === id)[0] || null;
}
function auswahlAbgleichen(){
  auswahl = auswahl.filter(id => blockVon(id));
  if (!sel) auswahl = [];
  else if (auswahl.indexOf(sel) < 0) auswahl = [sel];
  if (textModus && auswahl.indexOf(textModus) < 0) textModus = null;
  if (zuschnitt && (auswahl.indexOf(zuschnitt) < 0 || !blockVon(zuschnitt))) zuschnitt = null;
}
// Gruppen werden immer ganz gewaehlt, wie in Canva
function mitGruppen(ids){
  const aus = [];
  ids.forEach(id => {
    const b = blockVon(id);
    if (!b) return;
    (b.gruppe ? bloecke().filter(x => x.gruppe === b.gruppe).map(x => x.id) : [id])
      .forEach(x => { if (aus.indexOf(x) < 0) aus.push(x); });
  });
  return aus;
}
function waehle(ids){
  auswahl = mitGruppen(ids);
  sel = auswahl.length ? auswahl[auswahl.length - 1] : null;
  if (zuschnitt && auswahl.indexOf(zuschnitt) < 0){ zuschnitt = null; }
  if (textModus && auswahl.indexOf(textModus) < 0) textModus = null;
  gemerkteMk = null;
  baueRegler(); zielSetzen();
}
function gesperrtDabei(){ return auswahl.some(id => (blockVon(id) || {}).gesperrt); }

// Alle Raster-Bloecke der Slide bekommen feste Positionen. Erst danach darf
// irgendetwas verschoben werden, sonst springt der Rest.
function einfrieren(){ posSchreiben(null); }

function rechteck(id){
  const b = blockVon(id), L = letzteLayout[id] || {};
  const p = frei(b) ? b : L;
  return {x: p.x || 0, y: p.y || 0, w: p.w || 0,
          h: (b.typ === 'bild' ? (p.h || L.h) : null) || L.hBox || 0};
}

function zielSetzen(){
  if (!mv) return;
  auswahlAbgleichen();
  const els = auswahl.map(boxVon).filter(Boolean);
  const gesperrt = gesperrtDabei();
  document.querySelectorAll('#flaeche .box').forEach(el => {
    el.classList.toggle('gewaehlt', auswahl.indexOf(el.dataset.art) >= 0);
    el.classList.toggle('tippt', el.dataset.art === textModus);
    el.classList.toggle('zuschneiden', el.dataset.art === zuschnitt);
  });
  const nurText = els.length === 1 && (blockVon(auswahl[0]) || {}).typ !== 'bild' && (blockVon(auswahl[0]) || {}).typ !== 'form';
  const aktiv = !gesperrt && !textModus && !zuschnitt;
  mv.className = gesperrt ? 'gesperrt' : '';
  mv.draggable = aktiv;
  mv.resizable = aktiv;
  mv.rotatable = aktiv;
  mv.keepRatio = els.length > 1;
  mv.renderDirections = nurText ? ['w', 'e', 'nw', 'ne', 'sw', 'se']
                                : ['n', 's', 'w', 'e', 'nw', 'ne', 'sw', 'se'];
  mv.elementGuidelines = [].slice.call(document.querySelectorAll('#flaeche .box'))
                           .filter(el => els.indexOf(el) < 0);
  const st = D.stil;
  mv.verticalGuidelines = [0, st.randX, st.breite / 2, st.breite - st.randX, st.breite].map(v => v * k);
  mv.horizontalGuidelines = [0, st.randOben, st.hoehe / 2, st.hoehe - st.randUnten, st.hoehe].map(v => v * k);
  mv.target = els.length > 1 ? els : (els[0] || null);
  mv.updateRect();
}

// Eine Geste beginnt. Ein blosser Klick ist fuer Moveable auch ein Zieh-Beginn,
// darum wird erst bei der ersten echten Bewegung gemerkt und eingefroren.
let bewegt = false;
function gesteStart(){
  if (gesperrtDabei() || textModus) return false;
  bewegt = false;
  return true;
}
function ersteBewegung(){
  if (bewegt) return;
  bewegt = true;
  merke();
  einfrieren();
}
// Eine Geste endet: Werte aus den Boxen ins Modell schreiben
function gesteEnde(){
  auswahl.forEach(id => {
    const b = blockVon(id), el = boxVon(id);
    if (!b || !el) return;
    b.x = Math.round(parseFloat(el.style.left));
    b.y = Math.round(parseFloat(el.style.top));
    b.w = Math.max(20, Math.round(parseFloat(el.style.width)));
    if (b.typ === 'bild' || b.typ === 'form') b.h = Math.max(4, Math.round(parseFloat(el.style.height)));
    if (el.dataset.dreh !== undefined){
      let d = Math.round(((+el.dataset.dreh % 360) + 360) % 360 * 10) / 10;
      if (d === 0 || d === 360) delete b.dreh; else b.dreh = d;
    }
    if (el.dataset.skaliert) b.groesse = Math.max(6, Math.round(parseFloat(el.style.fontSize)));
  });
  alles();
}
function felderZeigen(el){
  if (auswahl.length !== 1 || !el) return;
  const p = {x: parseFloat(el.style.left), y: parseFloat(el.style.top),
             w: parseFloat(el.style.width), h: parseFloat(el.style.height)};
  for (const ff in posFelder) if (posFelder[ff] && !isNaN(p[ff])) posFelder[ff].value = Math.round(p[ff]);
}

function moveableAnlegen(){
  const rah = document.getElementById('rahmen');
  mv = new Moveable(rah, {
    target: null, draggable: true, resizable: true, rotatable: true, snappable: true,
    origin: false, rotationPosition: 'bottom',
    throttleDrag: 0, throttleResize: 0, throttleRotate: 0,
    snapThreshold: 6, snapGap: true, isDisplaySnapDigit: false,
    snapRotationDegrees: [0, 45, 90, 135, 180, 225, 270, 315], snapRotationThreshold: 4,
    snapDirections: {top: true, left: true, bottom: true, right: true, center: true, middle: true},
    elementSnapDirections: {top: true, left: true, bottom: true, right: true, center: true, middle: true}
  });

  // ----- Verschieben
  const zieh = (ev) => {
    ersteBewegung();
    ev.target.style.left = ev.left + 'px';
    ev.target.style.top  = ev.top + 'px';
  };
  mv.on('dragStart', e => { if (!gesteStart()) e.stop(); });
  mv.on('drag', e => { zieh(e); felderZeigen(e.target); });
  mv.on('dragEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });
  mv.on('dragGroupStart', e => { if (!gesteStart()) e.stop(); });
  mv.on('dragGroup', e => e.events.forEach(zieh));
  mv.on('dragGroupEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });

  // ----- Groesse und Drehung. Moveable liefert Breite, Hoehe und Winkel, die
  // Position rechnen wir selbst in Folien-Pixeln: Beim Skalieren bleibt der
  // gegenueberliegende Punkt stehen, beim Gruppen-Drehen die Gruppenmitte.
  // Gilt auch fuer gedrehte Elemente (Drehung um die eigene Mitte wie in CSS).
  // Text: Seiten = Breite (Text bricht um), Ecken = alles groesser.
  // Bild: Ecken behalten das Seitenverhaeltnis, Seiten schneiden zu (cover).
  const merkeStart = t => {
    const left = parseFloat(t.style.left) || 0, top = parseFloat(t.style.top) || 0;
    const w = t.offsetWidth, h = t.offsetHeight;
    const d = t.dataset.dreh !== undefined ? +t.dataset.dreh : ((blockVon(t.dataset.art) || {}).dreh || 0);
    t._start = {left: left, top: top, w: w, h: h, cx: left + w / 2, cy: top + h / 2, dreh: d,
                fs: parseFloat(getComputedStyle(t).fontSize)};
  };
  const drehe = (x, y, grad) => {
    const r = grad * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return [x * c - y * s, x * s + y * c];
  };
  const platziere = (t, cx, cy) => {
    t.style.left = (cx - t.offsetWidth / 2) + 'px';
    t.style.top  = (cy - t.offsetHeight / 2) + 'px';
  };
  const setzeGroesse = (t, w, h, schrift) => {
    t.style.width = w + 'px';
    if (t.classList.contains('bild') || t.classList.contains('form')) t.style.height = h + 'px';
    else if (schrift){ t.style.fontSize = (t._start.fs * w / t._start.w) + 'px'; t.dataset.skaliert = '1'; }
  };
  const groesse = ev => {
    ersteBewegung();
    const t = ev.target, s = t._start, dir = ev.direction, ecke = !!(dir[0] && dir[1]);
    // Ecken: Verhaeltnis selbst erzwingen, Moveable haelt es bei gedrehten Elementen nicht
    setzeGroesse(t, ev.width, ecke ? ev.width * s.h / s.w : ev.height, ecke);
    // Text an der Seite gezogen: die Oberkante bleibt, der Text waechst nach unten
    const dy = (dir[1] === 0 && !t.classList.contains('bild') && !t.classList.contains('form')) ? 1 : dir[1];
    const fest = drehe(-dir[0] * s.w / 2, -dy * s.h / 2, s.dreh);
    const neu  = drehe(-dir[0] * t.offsetWidth / 2, -dy * t.offsetHeight / 2, s.dreh);
    platziere(t, s.cx + fest[0] - neu[0], s.cy + fest[1] - neu[1]);
  };
  const rahmenVon = liste => {
    const R = liste.map(t => t._start);
    const x0 = Math.min.apply(null, R.map(s => s.left)), y0 = Math.min.apply(null, R.map(s => s.top));
    const x1 = Math.max.apply(null, R.map(s => s.left + s.w)), y1 = Math.max.apply(null, R.map(s => s.top + s.h));
    return {x0: x0, y0: y0, x1: x1, y1: y1};
  };
  mv.on('resizeStart', e => {
    if (!gesteStart()){ e.stop(); return; }
    merkeStart(e.target);
    if (e.direction[0] && e.direction[1]) e.setRatio(e.target.offsetWidth / e.target.offsetHeight);
  });
  mv.on('resize', groesse);
  mv.on('resizeEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });

  let gruppe0 = null;
  mv.on('resizeGroupStart', e => {
    if (!gesteStart()){ e.stop(); return; }
    e.events.forEach(ev => merkeStart(ev.target));
    gruppe0 = Object.assign(rahmenVon(e.events.map(ev => ev.target)), {dir: e.direction});
  });
  mv.on('resizeGroup', e => {
    if (!e.events.length) return;
    ersteBewegung();
    const g = gruppe0, dir = g.dir, erst = e.events[0];
    const f = Math.max(0.05, erst.width / erst.target._start.w);     // Gruppen skalieren im Verhaeltnis
    const ax = dir[0] > 0 ? g.x0 : dir[0] < 0 ? g.x1 : (g.x0 + g.x1) / 2;
    const ay = dir[1] > 0 ? g.y0 : dir[1] < 0 ? g.y1 : (g.y0 + g.y1) / 2;
    e.events.forEach(ev => {
      const t = ev.target, s = t._start;
      setzeGroesse(t, s.w * f, s.h * f, true);
      platziere(t, ax + (s.cx - ax) * f, ay + (s.cy - ay) * f);
    });
  });
  mv.on('resizeGroupEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });

  // ----- Drehen (rastet bei 0, 45, 90 ... Grad ein)
  const setzeDreh = (t, grad) => {
    t.style.transform = 'rotate(' + grad + 'deg)';
    t.dataset.dreh = grad;
  };
  mv.on('rotateStart', e => { if (!gesteStart()) e.stop(); });
  mv.on('rotate', e => {
    ersteBewegung();
    setzeDreh(e.target, e.rotation !== undefined ? e.rotation : e.rotate);
  });
  mv.on('rotateEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });

  let drehMitte = null;
  mv.on('rotateGroupStart', e => {
    if (!gesteStart()){ e.stop(); return; }
    e.events.forEach(ev => merkeStart(ev.target));
    const g = rahmenVon(e.events.map(ev => ev.target));
    drehMitte = [(g.x0 + g.x1) / 2, (g.y0 + g.y1) / 2];
  });
  mv.on('rotateGroup', e => {
    ersteBewegung();
    const delta = e.rotation !== undefined ? e.rotation : e.rotate;
    e.events.forEach(ev => {
      const t = ev.target, s = t._start;
      const p = drehe(s.cx - drehMitte[0], s.cy - drehMitte[1], delta);
      setzeDreh(t, s.dreh + delta);
      platziere(t, drehMitte[0] + p[0], drehMitte[1] + p[1]);
    });
  });
  mv.on('rotateGroupEnd', e => { if (e.isDrag && bewegt) gesteEnde(); });

  // ----- Auswahl per Klick, Umschalt-Klick und Rahmen ziehen
  const buehne = document.getElementById('buehne');
  sx = new Selecto({
    container: document.body, dragContainer: buehne,
    selectableTargets: ['#flaeche .box'], hitRate: 0, ratio: 0,
    selectByClick: true, selectFromInside: false, toggleContinueSelect: [['shift'], ['meta']]
  });
  sx.on('dragStart', e => {
    const t = e.inputEvent.target;
    if (leertaste || e.inputEvent.button === 1){ e.stop(); return; }            // Ansicht schieben
    if (mv.isMoveableElement(t)){ e.stop(); return; }                            // Griffe
    if (zuschnitt){                                                              // Bild im Rahmen schieben
      const el = boxVon(zuschnitt);
      if (el && el.contains(t)){ e.stop(); zuschnittZiehen(e.inputEvent); return; }
    }
    const drauf = auswahl.map(boxVon).some(el => el && (el === t || el.contains(t)));
    if (drauf && !e.inputEvent.shiftKey){ e.stop(); return; }                    // Gewaehlte ziehen
    if (textModus){ const el = boxVon(textModus); if (el && el.contains(t)){ e.stop(); return; } }
  });
  sx.on('selectEnd', e => {
    waehle(e.selected.map(el => el.dataset.art));
    if (e.isDragStart && e.selected.length){
      e.inputEvent.preventDefault();
      mv.waitToChangeTarget().then(() => mv.dragStart(e.inputEvent));
    }
  });

  // ----- Doppelklick auf Text: Textmodus, Woerter markieren und formatieren
  document.getElementById('flaeche').addEventListener('dblclick', e => {
    const box = e.target.closest && e.target.closest('.box');
    if (!box) return;
    if ((blockVon(box.dataset.art) || {}).gesperrt) return;
    if (box.classList.contains('bild')){ zuschnittStart(box.dataset.art); return; }
    textModus = box.dataset.art;
    sel = textModus; auswahl = [textModus];
    baueRegler(); zielSetzen();
    melde('Textmodus: Woerter markieren und oben formatieren. Esc beendet.', 6000);
  });

  // ----- Ansicht schieben: Leertaste halten oder mittlere Maustaste
  buehne.addEventListener('mousedown', e => {
    if (!(leertaste || e.button === 1)) return;
    e.preventDefault();
    const ax = buehne.scrollLeft, ay = buehne.scrollTop, mx = e.clientX, my = e.clientY;
    buehne.classList.add('schiebt');
    const move = ev => {
      buehne.scrollLeft = ax - (ev.clientX - mx);
      buehne.scrollTop  = ay - (ev.clientY - my);
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      buehne.classList.remove('schiebt');
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

function zeichneBuehne(){
  const buehne = document.getElementById('buehne');
  const rah = document.getElementById('rahmen');
  const fl = document.getElementById('flaeche');
  const sx0 = buehne.scrollLeft, sy0 = buehne.scrollTop;
  fl.innerHTML = '';
  kFit = Math.min((buehne.clientHeight - 40) / D.stil.hoehe,
                  (buehne.clientWidth  - 40) / D.stil.breite);
  k = kFit * zoom / 100;
  rah.style.width  = Math.round(D.stil.breite * k) + 'px';
  rah.style.height = Math.round(D.stil.hoehe  * k) + 'px';
  const r = renderSlide(slide(), D.stil, fl);
  r.el.style.transform = 'scale(' + k + ')';
  letzteLayout = r.masse.layout;
  if (!mv) moveableAnlegen();
  zielSetzen();
  if (zuschnitt) geistZeigen();
  buehne.scrollLeft = sx0; buehne.scrollTop = sy0;
}

// ----------------------------------------------------- Befehle fuer die Auswahl

function loeschen(){
  const weg = auswahl.filter(id => !(blockVon(id) || {}).gesperrt);
  if (!weg.length) return;
  merke();
  const s = slide();
  s.bloecke = s.bloecke.filter(x => weg.indexOf(x.id) < 0);
  if (s.ebenen) s.ebenen = s.ebenen.filter(x => weg.indexOf(x) < 0);
  sel = null; auswahl = []; textModus = null;
  alles();
}
function verschieben(dx, dy){
  if (gesperrtDabei() || !auswahl.length) return;
  merke(); einfrieren();
  auswahl.forEach(id => { const b = blockVon(id); b.x += dx; b.y += dy; });
  zeichne(); baueRegler();
}
// Kopie mit festen Positionen, auch wenn das Original im Raster liegt
function kopieVon(ids){
  return ids.map(id => {
    const b = JSON.parse(JSON.stringify(blockVon(id)));
    const L = letzteLayout[id] || {};
    if (!frei(b)){ b.x = L.x; b.y = L.y; b.w = L.w; if (L.h) b.h = L.h; }
    if (b.typ === 'bild' && b.h === undefined && L.h) b.h = L.h;
    delete b.gesperrt;
    return b;
  });
}
function kopieren(){
  if (!auswahl.length) return;
  ablage = {projekt: PROJEKT, slide: akt, mal: 0, bloecke: kopieVon(auswahl)};
  melde(auswahl.length + (auswahl.length === 1 ? ' Element' : ' Elemente') + ' kopiert', 2500);
}
async function einsetzen(liste, versatz){
  merke(); einfrieren();
  const neueGruppen = {}, ids = [];
  for (const q0 of liste){
    const b = JSON.parse(JSON.stringify(q0));
    b.id = neueId();
    b.x = (b.x || 0) + versatz; b.y = (b.y || 0) + versatz;
    if (b.gruppe){ neueGruppen[b.gruppe] = neueGruppen[b.gruppe] || ('g' + Date.now().toString(36) + ids.length); b.gruppe = neueGruppen[b.gruppe]; }
    if (b.typ === 'bild' && b.rolle === 'bild') delete b.rolle;
    bloecke().push(b); ids.push(b.id);
  }
  auswahl = ids; sel = ids[ids.length - 1];
  alles();
}
async function einfuegen(){
  if (!ablage) return;
  if (ablage.projekt !== PROJEKT){
    // Bilder aus einem anderen Projekt mitnehmen
    for (const b of ablage.bloecke.filter(x => x.typ === 'bild' && x.datei)){
      for (const datei of [b.datei, b.original].filter(Boolean)){
        await fetch(mitProjekt('bildkopie'), {method: 'POST',
          body: JSON.stringify({von: ablage.projekt, datei: datei})});
      }
    }
  }
  const gleich = ablage.projekt === PROJEKT && ablage.slide === akt;
  ablage.mal++;
  await einsetzen(ablage.bloecke, gleich ? 24 * ablage.mal : 0);
}
function duplizieren(){
  if (!auswahl.length) return;
  einsetzen(kopieVon(auswahl), 24);
}
function gruppieren(){
  if (auswahl.length < 2) return;
  merke();
  const g = 'g' + Date.now().toString(36);
  auswahl.forEach(id => { blockVon(id).gruppe = g; });
  alles(); melde('Gruppiert. Ein Klick waehlt jetzt alle.', 3000);
}
function entgruppieren(){
  if (!auswahl.some(id => blockVon(id).gruppe)) return;
  merke();
  auswahl.forEach(id => { delete blockVon(id).gruppe; });
  alles(); melde('Gruppe aufgeloest.', 2500);
}
function sperren(){
  if (!auswahl.length) return;
  merke();
  const alleZu = auswahl.every(id => blockVon(id).gesperrt);
  auswahl.forEach(id => { if (alleZu) delete blockVon(id).gesperrt; else blockVon(id).gesperrt = true; });
  alles(); melde(alleZu ? 'Entsperrt.' : 'Gesperrt: laesst sich nicht mehr verschieben.', 3000);
}
function drehenAuf(grad){
  if (gesperrtDabei() || !auswahl.length) return;
  merke(); einfrieren();
  auswahl.forEach(id => { const b = blockVon(id); if (grad) b.dreh = grad; else delete b.dreh; });
  alles();
}
// Eine Auswahl an der Folie, mehrere aneinander ausrichten
function ausrichten(art){
  const ids = auswahl.filter(id => !blockVon(id).gesperrt);
  if (!ids.length) return;
  merke(); einfrieren();
  const st = D.stil;
  const R = auswahl.map(rechteck);
  let ref = {x: 0, y: 0, w: st.breite, h: st.hoehe};
  if (auswahl.length > 1){
    const x0 = Math.min.apply(null, R.map(r => r.x)), y0 = Math.min.apply(null, R.map(r => r.y));
    const x1 = Math.max.apply(null, R.map(r => r.x + r.w)), y1 = Math.max.apply(null, R.map(r => r.y + r.h));
    ref = {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  }
  ids.forEach(id => {
    const b = blockVon(id), r = rechteck(id);
    if (art === 'links')  b.x = ref.x;
    if (art === 'mitte')  b.x = Math.round(ref.x + (ref.w - r.w) / 2);
    if (art === 'rechts') b.x = ref.x + ref.w - r.w;
    if (art === 'oben')   b.y = ref.y;
    if (art === 'mittig') b.y = Math.round(ref.y + (ref.h - r.h) / 2);
    if (art === 'unten')  b.y = ref.y + ref.h - r.h;
  });
  alles();
}
function verteilen(richtung){
  if (auswahl.length < 3) return;
  merke(); einfrieren();
  const xy = richtung === 'h' ? 'x' : 'y', wh = richtung === 'h' ? 'w' : 'h';
  const R = auswahl.map(id => Object.assign({id: id}, rechteck(id))).sort((a, b) => a[xy] - b[xy]);
  const anfang = R[0][xy], ende = R[R.length - 1][xy] + R[R.length - 1][wh];
  const summe = R.reduce((s, r) => s + r[wh], 0);
  const luecke = (ende - anfang - summe) / (R.length - 1);
  let pos = anfang;
  R.forEach(r => { const b = blockVon(r.id); if (!b.gesperrt) b[xy] = Math.round(pos); pos += r[wh] + luecke; });
  alles();
}

// ----------------------------------------------------------------- Zoom

function zoomAnzeigen(){
  document.getElementById('zBalken').value = Math.max(100, Math.min(500, Math.round(zoom)));
  document.getElementById('zZahl').value = Math.round(zoom);
}
function zoomSetzen(neu, zeigerX, zeigerY){
  const buehne = document.getElementById('buehne');
  const rah = document.getElementById('rahmen');
  neu = Math.max(25, Math.min(800, neu));
  if (Math.abs(neu - zoom) < 0.01) return;
  let px = null, py = null;
  if (zeigerX !== undefined){
    const r = rah.getBoundingClientRect();
    px = (zeigerX - r.left) / k;      // Punkt der Slide unter dem Zeiger
    py = (zeigerY - r.top)  / k;
  }
  zoom = neu;
  zoomAnzeigen();
  zeichneBuehne();
  if (px !== null){
    const r2 = rah.getBoundingClientRect();
    buehne.scrollLeft += (r2.left + px * k) - zeigerX;
    buehne.scrollTop  += (r2.top  + py * k) - zeigerY;
  }
}

  L.scrollTop = stand;
}

document.addEventListener('keydown', e => {
  const tg = (e.target.tagName || '').toLowerCase();
  const tippt = tg === 'input' || tg === 'textarea' || tg === 'select' || e.target.isContentEditable;
  if (document.querySelector('.dlg[style*="flex"]')){
    if (e.key === 'Escape' && document.getElementById('elemente').style.display === 'flex') elementeZu();
    if (e.key === 'Escape' && document.getElementById('schriften').style.display === 'flex') schriftenZu();
    return;
  }
  if ((e.key === 'Escape' || e.key === 'Enter') && zuschnitt && !tippt){ e.preventDefault(); zuschnittEnde(); return; }
  if (e.key === 'Escape'){
    if (textModus){ textModus = null; gemerkteMk = null;
      document.getElementById('werkzeuge').style.display = 'none'; zielSetzen(); return; }
    abwaehlen(); return;
  }
  if (e.key === ' ' && !tippt){
    e.preventDefault();
    if (!leertaste){ leertaste = true; document.getElementById('buehne').classList.add('pan'); }
    return;
  }
  const frei_ = !tippt && !textModus;
  if (frei_ && auswahl.length && !(e.ctrlKey || e.metaKey)){
    if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); loeschen(); return; }
    const p = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key];
    if (p){ e.preventDefault(); const s = e.shiftKey ? 10 : 1; verschieben(p[0] * s, p[1] * s); return; }
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  const kk = e.key.toLowerCase();
  if (kk === 'z' && !e.shiftKey){
    if (tippt) return;
    e.preventDefault(); springe(historie, zukunft);
  } else if (kk === 'y' || (kk === 'z' && e.shiftKey)){
    e.preventDefault(); springe(zukunft, historie);
  } else if (!frei_){
    return;                                   // im Text: Strg+C/V gehoeren dem Browser
  } else if (kk === 'c'){ e.preventDefault(); kopieren(); }
  else if (kk === 'x'){ e.preventDefault(); kopieren(); loeschen(); }
  else if (kk === 'v'){                      // eigentlich das paste-Ereignis; Safari schickt es
    pasteKam = false;                         // ausserhalb von Textfeldern nicht immer
    setTimeout(() => { if (!pasteKam && ablage && !document.querySelector('.dlg[style*="flex"]')) einfuegen(); }, 100);
  }
  else if (kk === 'd'){ e.preventDefault(); duplizieren(); }
  else if (kk === 'a'){ e.preventDefault(); waehle(bloecke().map(b => b.id)); }
  else if (kk === 'g'){ e.preventDefault(); if (e.shiftKey) entgruppieren(); else gruppieren(); }
  else if (kk === 'l'){ e.preventDefault(); sperren(); }
});

// Zoom: Mausrad zoomt auf den Zeiger, Regler und Prozentfeld unten
(function(){
  const buehne = document.getElementById('buehne');
  // Mausrad: eine Raste = ein Zoomschritt. Trackpad: kleine Schritte sammeln,
  // waagerechtes Wischen zoomt nicht, Pinch (ctrlKey in Chrome) staerker.
  let rad = 0;
  buehne.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    if (!d) return;
    rad += e.ctrlKey ? d * 5 : d;
    if (Math.abs(rad) < 20) return;
    const s = Math.max(-100, Math.min(100, rad)) / 100; rad = 0;
    if (zuschnitt){ zuschnittZoom(Math.pow(1.08, -s)); return; }
    zoomSetzen(zoom * Math.pow(1.12, -s), e.clientX, e.clientY);
  }, {passive: false});
  let gStart = 1;                                       // Safari: Pinch als gesture-Ereignis
  buehne.addEventListener('gesturestart', e => { e.preventDefault(); gStart = zoom; });
  buehne.addEventListener('gesturechange', e => { e.preventDefault(); zoomSetzen(gStart * e.scale, e.clientX, e.clientY); });
  const mitte = () => {
    const r = buehne.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };
  document.getElementById('zPlus').onclick  = () => zoomSetzen(zoom * 1.25, ...mitte());
  document.getElementById('zMinus').onclick = () => zoomSetzen(zoom / 1.25, ...mitte());
  document.getElementById('zFit').onclick   = () => { zoomSetzen(100); buehne.scrollTo(0, 0); };
  document.getElementById('zBalken').oninput = e => zoomSetzen(+e.target.value, ...mitte());
  document.getElementById('zZahl').onchange  = e => zoomSetzen(+e.target.value, ...mitte());
})();

(function(){
  const buehne = document.getElementById('buehne');
  const mitDateien = e => e.dataTransfer && [].slice.call(e.dataTransfer.types || []).indexOf('Files') >= 0;
  buehne.addEventListener('dragover', e => {
    if (!mitDateien(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    buehne.classList.add('ablegen');
  });
  buehne.addEventListener('dragleave', e => {
    if (!buehne.contains(e.relatedTarget)) buehne.classList.remove('ablegen');
  });
  buehne.addEventListener('drop', e => {
    buehne.classList.remove('ablegen');
    if (!mitDateien(e)) return;
    e.preventDefault();
    const dateien = [].slice.call(e.dataTransfer.files).filter(istBilddatei);
    if (!dateien.length){ melde('Nur Bilder lassen sich ablegen (PNG, JPG, WEBP, GIF, SVG).', 5000); return; }
    const auf = e.target.closest && e.target.closest('#flaeche .box.bild');
    bilderEinsetzen(dateien, folienPunkt(e.clientX, e.clientY), auf ? auf.dataset.art : null);
  });
  // Strg+V: Bild aus der Zwischenablage (Screenshot, kopiertes Bild) oder eigene Ablage
  document.addEventListener('beforepaste', e => {     // Safari: Einfuegen auch ohne Textfeld erlauben
    const tg = (e.target.tagName || '').toLowerCase();
    if (!(tg === 'input' || tg === 'textarea' || e.target.isContentEditable || textModus)) e.preventDefault();
  });
  document.addEventListener('paste', e => {
    pasteKam = true;
    const tg = (e.target.tagName || '').toLowerCase();
    if (tg === 'input' || tg === 'textarea' || e.target.isContentEditable || textModus) return;
    if (document.querySelector('.dlg[style*="flex"]')) return;
    const dateien = [].slice.call((e.clipboardData && e.clipboardData.files) || []).filter(istBilddatei);
    if (dateien.length){ e.preventDefault(); bilderEinsetzen(dateien, null, null); return; }
    if (ablage){ e.preventDefault(); einfuegen(); }
  });
})();

function formatName(p){
  const b = +p.breite || 0, h = +p.hoehe || 0;     // immer Zahlen, nie Text ins HTML
  return h === 1350 ? '4:5' : h === 1440 ? '3:4' : b + 'x' + h;
}

async function projektLaden(name){

    try { meinStand = (await (await fetch('stand', {cache: 'no-store'})).text()).trim(); } catch (e) {}

  } finally { wechseltGerade = false; }
}

// aktion: oeffnen | neu | duplizieren. Der Server merkt sich das Projekt.
async function projektWechsel(a){
  wechseltGerade = true;
  try {
    clearTimeout(sicherTimer);
    const streit = document.getElementById('konflikt').style.display === 'flex';
    if (D && PROJEKT && !streit && schmutzig()) await speichern();   // Duplikat bekommt den neuesten Stand
    let j;
    try { j = await (await fetch('projekt', {method: 'POST', body: JSON.stringify(a)})).json(); }
    catch (e) { j = {ok: false, fehler: 'Das Cockpit antwortet nicht.'}; }
    if (j.ok) await projektLaden(j.name);
    return j;
  } finally { wechseltGerade = false; }
}
